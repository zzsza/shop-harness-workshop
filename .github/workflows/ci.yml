name: ci

on:
  push:
  pull_request:
  # 손으로 다시 돌릴 때(Actions 탭의 Run workflow)
  workflow_dispatch:

jobs:
  verify:
    # 레포 관리용(세 OS에서 설치·점검). 수강생 fork에서는 돌지 않고, fork의 PR은 pr.yml이 검사한다.
    if: github.repository == 'yansfil/shop-harness-workshop'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 실습은 Node 22.18 이상을 받는다(tools/setup/node-check.mjs). 가장 낮은 22와 가장 새 LTS 26을 돌린다.
        node: [22, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      # npm run setup은 claude 명령도 확인하므로 runner에 Claude Code를 깐다(로그인은 하지 않는다).
      - run: npm install -g @anthropic-ai/claude-code
      - run: npm run setup
      # npm run ci가 커밋한 코드만 검사하는지 세 OS에서 확인한다(Windows의 작업 공간 링크는 절대 경로 junction이다).
      # 수강생 컴퓨터처럼 내 폴더 경로로 돌린다(GITHUB_* 변수를 비운다). 커밋하지 않은 packages 변경은 초록,
      # 그 변경을 import한 커밋은 빨강이어야 하고, 끝난 뒤 원본 파일·링크는 그대로, 임시 폴더는 없어야 한다.
      - name: npm run ci가 커밋 안 한 코드를 섞지 않는지 확인
        shell: bash
        run: |
          local_ci() { GITHUB_ACTIONS= GITHUB_BASE_REF= GITHUB_STEP_SUMMARY= npm run ci -- "$@" 2>&1 | tee "$RUNNER_TEMP/ci.log"; return "${PIPESTATUS[0]}"; }
          base=$(git rev-parse HEAD)
          echo 'export const uncommittedOnly = 1;' >> packages/shared/src/index.ts
          cp packages/shared/src/index.ts "$RUNNER_TEMP/index.ts"
          local_ci --base "$base"
          printf 'import { uncommittedOnly } from "@grabmarket/shared";\nexport const probe = uncommittedOnly;\n' > apps/api/src/ci-probe.ts
          git add apps/api/src/ci-probe.ts
          git -c user.name=ci -c user.email=ci@example.invalid commit -q -m "probe: import an uncommitted export"
          code=0; local_ci --base "$base" || code=$?
          test "$code" = 1 || { echo "커밋 안 한 코드를 쓰는 커밋이 빨강(1)이 아니라 $code 입니다."; exit 1; }
          grep -q "has no exported member 'uncommittedOnly'" "$RUNNER_TEMP/ci.log" || { echo "빨강의 이유가 커밋 안 한 export가 아닙니다."; exit 1; }
          cmp packages/shared/src/index.ts "$RUNNER_TEMP/index.ts"
          test -f node_modules/@grabmarket/shared/src/index.ts
          test "$(git worktree list | wc -l)" -eq 1
          test -z "$(ls "$(node -p 'require("os").tmpdir()')" | grep '^shop-ci-')"
