name: ci

on:
  push:
  pull_request:
  # 손으로 다시 돌릴 때(Actions 탭의 Run workflow)
  workflow_dispatch:

jobs:
  verify:
    # 레포 관리용(세 OS에서 설치·점검). 수강생 fork에서는 돌지 않고, fork의 PR은 pr.yml이 검사한다.
    if: github.repository == 'yansfil/shop-harness-workshop'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 실습은 Node 22.18 이상을 받는다(tools/setup/node-check.mjs). 가장 낮은 22와 가장 새 LTS 26을 돌린다.
        node: [22, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # day3 브랜치는 lint와 빌드만 돌린다.
      - run: npm run lint
      - run: npm run build
